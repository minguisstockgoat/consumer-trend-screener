name: Google Trends 일일 갱신

on:
  schedule:
    - cron: "27 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-google-trends
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 수집기 캐시 복원
        uses: actions/cache@v4
        with:
          path: runtime
          key: trendspyg-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trendspyg-${{ runner.os }}-

      - name: 실행 환경 확인
        run: google-chrome --version

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Google Trends 순환 수집
        run: python scripts/update_trends.py --batches 2

      - name: 변경 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/trends.json
          if git diff --cached --quiet; then
            echo "변경된 데이터가 없습니다."
          else
            git commit -m "구글 트렌드 데이터 자동 갱신"
            git push
          fi
